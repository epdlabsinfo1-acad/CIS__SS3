<!-- ================= HOME PAGE (index.html) ================= -->
<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="index.css" />
  <title>Expense Tracker - Home</title>
</head>

<body>
  <div class="background--image">
  </div>


  <div class="header">
    <h3>Expenses Tracker</h3>
    <nav>
      <ul class="nav_items">
        <li class="nav_item"><a href="">🔔</a></li>
        <li class="nav_item mobile"><a href="">👤</a></li>
        <li class="nav_item desk_top"><a href="">Login</a></li>
        <li class="nav_item desk_top"><a href="">Sign-Up</a></li>
      </ul>
    </nav>
  </div>



  <main>

    <div class="container">
      <h2>💰 All Transactions</h2>
      <h3 id="balance">₦0</h3>
      <input id="desc" placeholder="Description" />
      <input id="amount" type="number" placeholder="Amount" />
      <select id="type">
        <option value="income">Income</option>
        <option value="expense">Expense</option>
      </select>
      <button onclick="addTransaction()">Add</button>
      <section class="list__wrapper">
        <div id="list"></div>
      </section>
    </div>
  </main>


  <div class="footer_nav">
    <nav>
      <ul class="footer_nav--items">
        <li class="footer_nav--item">
          <a href="income.html">Income</a>
        </li>

        <li class="footer_nav--item">
          <a href="expenses.html">Expense</a>
        </li>
      </ul>
    </nav>
  </div>

  <script>


    let transactions = JSON.parse(localStorage.getItem("transactions")) || [];

    function save() {
      localStorage.setItem("transactions", JSON.stringify(transactions));
    }

    function addTransaction() {
      const desc = document.getElementById("desc").value;
      const amount = parseFloat(document.getElementById("amount").value);
      const type = document.getElementById("type").value;
      if (!desc || isNaN(amount)) return alert("Invalid");
      transactions.push({ id: Date.now(), desc, amount, type });
      save();
      render();
    }




    function render() {
      const list = document.getElementById("list");
      list.innerHTML = "";
      let balance = 0;
      transactions.forEach((t) => {
        balance += t.type === "income" ? t.amount : -t.amount;
        list.innerHTML += `<div class="list-item">
<span>${t.desc} - ₦${t.amount}</span>
<button class="delete" onclick="deleteTransaction(${t.id})">Delete</button>
</div>`;
      });
      document.getElementById("balance").innerText = "₦" + balance;
    }

    render();
  </script>
</body>

</html>
